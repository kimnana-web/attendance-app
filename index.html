<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#4F46E5">
<title>천하무적동부교육팀 교육생 만족도 체크</title>
<style>
  :root{
    --navy:#4F46E5;
    --navy-deep:#1E1B4B;
    --amber:#F59E0B;
    --teal:#10B981;
    --red:#EF4444;
    --paper:#F3F4FD;
    --card:#FFFFFF;
    --ink:#1F2430;
    --sub:#6B7280;
    --line:#E7E9F5;
    --shadow: 0 1px 2px rgba(30,27,75,.04), 0 8px 24px rgba(79,70,229,.07);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;background:#F3F4FD;}
  body{min-height:100vh;}
  #app-root{
    font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo','Segoe UI',sans-serif;
    background:radial-gradient(circle at 12% 0%, #EEF0FF 0%, var(--paper) 42%);
    color:var(--ink);
    min-height:100%;
    padding:0;
    line-height:1.5;
    letter-spacing:-0.01em;
  }
  .shell{max-width:520px;margin:0 auto;padding:18px 16px 60px;}
  .topbar{
    display:flex;align-items:flex-start;justify-content:space-between;
    padding:14px 4px 18px;
  }
  .brand{display:flex;align-items:flex-start;gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:11px;
    background:linear-gradient(135deg,#6366F1,#4F46E5 55%,#4338CA);
    box-shadow:0 4px 14px rgba(79,70,229,.35);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:16px;flex-shrink:0;
  }
  .brand-title{font-size:15px;font-weight:800;color:var(--navy-deep);line-height:1.3;}
  .brand-sub{font-size:11px;color:var(--sub);margin-top:3px;}
  .back-btn{
    background:none;border:none;color:var(--navy);font-size:13px;font-weight:600;
    cursor:pointer;padding:6px 4px;display:flex;align-items:center;gap:4px;
  }
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:18px;margin-bottom:14px;box-shadow:var(--shadow);
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:none;border-radius:13px;padding:13px 18px;font-size:14px;font-weight:700;
    cursor:pointer;width:100%;transition:opacity .15s ease, transform .1s ease;
  }
  .btn:active{opacity:.8;transform:scale(.99);}
  .btn-primary{background:linear-gradient(135deg,#6366F1,#4F46E5);color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.3);}
  .btn-amber{background:linear-gradient(135deg,#FBBF24,#F59E0B);color:#3F2D02;box-shadow:0 6px 16px rgba(245,158,11,.28);}
  .btn-teal{background:var(--teal);color:#fff;}
  .btn-outline{background:#fff;color:var(--navy);border:1.5px solid var(--line);}
  .btn-ghost{background:transparent;color:var(--sub);font-weight:600;}
  .btn-danger-ghost{background:transparent;color:var(--red);font-weight:600;font-size:12px;padding:4px 8px;width:auto;}
  .btn-sm{padding:8px 12px;font-size:12.5px;width:auto;}
  .row{display:flex;gap:8px;}
  .row > *{flex:1;}
  .empty{
    text-align:center;padding:48px 12px;color:var(--sub);
  }
  .empty-num{font-size:34px;font-weight:800;color:var(--line);margin-bottom:6px;}
  .session-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;
    border-radius:10px;
  }
  .session-item:active{background:#F5F6FF;}
  .session-item:last-child{border-bottom:none;}
  .session-idx{
    font-size:11px;font-weight:800;color:var(--amber);width:22px;flex-shrink:0;
  }
  .session-main{flex:1;min-width:0;}
  .session-title{font-size:14px;font-weight:700;color:var(--navy-deep);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .session-meta{font-size:11.5px;color:var(--sub);margin-top:2px;}
  .badge{
    font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:20px;flex-shrink:0;
  }
  .badge-done{background:#DCFCE7;color:#15803D;}
  .badge-pending{background:#FEF3C7;color:#B45309;}
  label.field-label{
    display:block;font-size:12px;font-weight:700;color:var(--sub);
    margin-bottom:6px;margin-top:14px;
  }
  label.field-label:first-child{margin-top:0;}
  input[type=text], input[type=number], textarea{
    width:100%;border:1.5px solid var(--line);border-radius:11px;
    padding:10px 11px;font-size:14px;font-family:inherit;color:var(--ink);
    background:#FAFAFF;
  }
  input:focus, textarea:focus{outline:none;border-color:var(--navy);background:#fff;}
  textarea{resize:vertical;min-height:56px;}
  .upload-zone{
    border:2px dashed #C7D2FE;border-radius:16px;padding:34px 16px;
    text-align:center;cursor:pointer;background:#F8F9FF;
  }
  .upload-zone:active{background:#EEF0FF;}
  .upload-icon{font-size:30px;margin-bottom:8px;}
  .upload-txt{font-size:13.5px;font-weight:700;color:var(--navy);}
  .upload-sub{font-size:11.5px;color:var(--sub);margin-top:3px;}
  .preview-img{width:100%;border-radius:12px;border:1px solid var(--line);margin-bottom:12px;}
  .student-row{
    border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;
    display:flex;gap:8px;align-items:center;background:#FAFAFF;
  }
  .student-row input{flex:1;}
  .rm-btn{
    width:28px;height:28px;border-radius:9px;border:none;background:#FEE2E2;
    color:var(--red);font-weight:800;cursor:pointer;flex-shrink:0;
  }
  .stat-strip{display:flex;gap:8px;margin-bottom:14px;}
  .stat-box{
    flex:1;background:#F8F9FF;border:1px solid var(--line);border-radius:13px;
    padding:10px;text-align:center;
  }
  .stat-num{font-size:19px;font-weight:800;color:var(--navy-deep);}
  .stat-lbl{font-size:10.5px;color:var(--sub);margin-top:2px;}
  .score-card{
    border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:10px;background:#fff;
    box-shadow:0 1px 2px rgba(30,27,75,.03);
  }
  .score-card.filled{border-color:#A7F3D0;background:#F5FEFA;}
  .sc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .sc-name{font-size:14.5px;font-weight:800;color:var(--navy-deep);}
  .sc-affil{
    margin-top:3px;width:100%;border:none;border-bottom:1px dashed var(--line);
    padding:2px 0;font-size:11.5px;color:var(--sub);background:transparent;border-radius:0;
  }
  .sc-affil:focus{outline:none;border-bottom-color:var(--navy);}
  .sc-time{font-size:11px;color:var(--sub);white-space:nowrap;flex-shrink:0;padding-top:2px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
  .chip{
    font-size:11.5px;font-weight:700;padding:6px 10px;border-radius:20px;
    border:1.5px solid var(--line);background:#fff;cursor:pointer;color:var(--ink);
  }
  .chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .score-input-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .score-input-row input{width:70px;flex:none;text-align:center;font-weight:800;}
  .score-input-row span{font-size:12px;color:var(--sub);font-weight:600;}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:var(--navy-deep);color:#fff;padding:11px 20px;border-radius:30px;
    font-size:13px;font-weight:700;z-index:999;box-shadow:0 10px 24px rgba(30,27,75,.35);
  }
  .spin{
    width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);
    border-top-color:#fff;animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-wrap{display:flex;align-items:center;justify-content:center;gap:10px;padding:26px 0;color:var(--sub);font-size:13px;font-weight:600;}
  .hint{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.55;}
  .fab-export{
    position:sticky;bottom:0;background:linear-gradient(0deg,var(--paper) 60%,transparent);
    padding:14px 0 4px;margin-top:6px;
  }
</style>
</head>
<body>

<div id="app-root">
  <div class="shell" id="shell"></div>
</div>

<script>
(function(){
  try{ document.title = '천하무적동부교육팀 교육생 만족도 체크'; }catch(e){}
  const shell = document.getElementById('shell');
  let view = 'list';
  let currentSession = null;   // full session object in memory while editing
  let draftStudents = null;    // editable extraction result before first save

  const REASON_PRESETS = [
    {score:100, label:'적극 참여', reason:'적극 참여, 높은 몰입도, 활발한 소통'},
    {score:90,  label:'성실 참여', reason:'성실히 참여, 원활한 소통'},
    {score:80,  label:'다소 제한적', reason:'참여했으나 의견공유, 상호작용이 다소 제한적'},
    {score:70,  label:'참여 저조', reason:'참여 저조, 집중도 낮음'},
    {score:60,  label:'참여 미흡', reason:'참여 거의 없음, 카메라/음성 응답 미확인'},
  ];

  // ---------- storage helpers ----------
  // 공개 웹 배포 버전: 기록은 각 사용자의 브라우저 localStorage에 저장됩니다.
  // 따라서 같은 URL을 사용해도 기기/브라우저별 기록은 서로 섞이지 않습니다.
  async function kvGet(key){
    try{ return window.localStorage.getItem(key); }catch(e){ return null; }
  }
  async function kvSet(key, value){
    try{ window.localStorage.setItem(key, value); return true; }
    catch(e){ console.error('kvSet fail', e); return false; }
  }
  async function kvDelete(key){
    try{ window.localStorage.removeItem(key); }catch(e){}
  }

  async function getIndex(){
    try{
      const v = await kvGet('session-index');
      return v ? JSON.parse(v) : [];
    }catch(e){ return []; }
  }
  async function saveIndex(idx){
    try{ await kvSet('session-index', JSON.stringify(idx)); }
    catch(e){ console.error('index save fail', e); }
  }
  async function getSession(id){
    try{
      const v = await kvGet('session:'+id);
      return v ? JSON.parse(v) : null;
    }catch(e){ return null; }
  }
  async function saveSession(sess){
    try{
      const ok = await kvSet('session:'+sess.id, JSON.stringify(sess));
      if(!ok) return false;
      let idx = await getIndex();
      const scoredCount = sess.students.filter(s=>s.score!==null && s.score!==undefined && s.score!=='').length;
      const entry = {
        id:sess.id, title:sess.title, date:sess.date,
        count:sess.students.length, scoredCount,
        done: scoredCount===sess.students.length && sess.students.length>0
      };
      idx = idx.filter(e=>e.id!==sess.id);
      idx.unshift(entry);
      await saveIndex(idx);
      return true;
    }catch(e){ console.error('save fail', e); return false; }
  }
  async function deleteSession(id){
    try{
      await kvDelete('session:'+id);
      let idx = await getIndex();
      idx = idx.filter(e=>e.id!==id);
      await saveIndex(idx);
    }catch(e){ console.error('delete fail', e); }
  }

  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function toast(msg){
    const t=document.createElement('div');
    t.className='toast'; t.textContent=msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 2200);
  }
  function esc(s){
    return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- OCR via server-side AI proxy ----------
  // 브라우저에 API 키를 노출하지 않습니다.
  // Vercel의 /api/extract 함수가 Vercel AI Gateway(OIDC)로 AI를 호출합니다. 별도 Anthropic 키가 필요하지 않습니다.
  async function extractFromImage(base64, mediaType){
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), 55000);
    let resp;
    try{
      resp = await fetch('/api/extract', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ base64, mediaType }),
        signal: controller.signal
      });
    }catch(e){
      if(e && e.name==='AbortError') throw new Error('사진 인식 시간이 너무 오래 걸렸습니다. 다시 시도해주세요.');
      throw new Error('AI 인식 서버에 연결하지 못했습니다. 인터넷 연결 또는 Vercel 배포 상태를 확인해주세요.');
    }finally{ clearTimeout(timer); }

    let data;
    try{ data = await resp.json(); }
    catch(e){ throw new Error(`AI 서버 응답을 읽지 못했습니다 (상태 코드 ${resp.status})`); }

    if(!resp.ok){
      const msg = data && data.error ? data.error : `AI 요청이 실패했습니다 (상태 코드 ${resp.status})`;
      throw new Error(msg);
    }
    return data;
  }

  // 카메라 원본 사진은 용량이 크고 일부 폰은 HEIC 등 API가 지원하지 않는 포맷으로 찍히므로,
  // 캔버스에 다시 그려 JPEG로 표준화하면서 크기도 줄인다.
  // blob: URL은 이 앱이 실행되는 샌드박스에서 막힐 수 있어, FileReader로 읽은 data: URL만 사용한다.
  function normalizeImage(file){
    const isHeic = /heic|heif/i.test(file.type||'') || /\.(heic|heif)$/i.test(file.name||'');
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onerror = ()=> reject(new Error('사진 파일을 읽는 중 문제가 발생했습니다. 다른 사진으로 다시 시도해주세요.'));
      reader.onload = ()=>{
        const rawDataUrl = reader.result;
        const img = new Image();
        img.onload = ()=>{
          try{
            const MAX_DIM = 1600;
            let { width, height } = img;
            if(width===0 || height===0){
              reject(new Error('사진 크기를 읽을 수 없습니다. 다른 사진으로 다시 시도해주세요.'));
              return;
            }
            if(width > MAX_DIM || height > MAX_DIM){
              const ratio = Math.min(MAX_DIM/width, MAX_DIM/height);
              width = Math.round(width*ratio);
              height = Math.round(height*ratio);
            }
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#fff';
            ctx.fillRect(0,0,width,height);
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.87);
            resolve({ base64: dataUrl.split(',')[1], mediaType: 'image/jpeg', dataUrl });
          }catch(e){
            reject(new Error('사진을 처리하지 못했습니다. 다른 사진으로 다시 시도해주세요.'));
          }
        };
        img.onerror = ()=>{
          if(isHeic){
            reject(new Error('HEIC 형식 사진은 이 브라우저에서 열 수 없습니다. 아이폰 설정 > 카메라 > 형식을 "호환성 우선"으로 바꾸거나, 사진 갤러리에서 이미 저장된 사진(또는 스크린샷)을 선택해 다시 시도해주세요.'));
          }else{
            reject(new Error('사진을 불러오지 못했습니다. 다른 사진으로 다시 시도해주세요.'));
          }
        };
        img.src = rawDataUrl;
      };
      reader.readAsDataURL(file);
    });
  }

  // ---------- render: list view ----------
  async function renderList(){
    shell.innerHTML = `
      <div class="topbar">
        <div class="brand">
          <div class="brand-mark">✓</div>
          <div>
            <div class="brand-title">천하무적동부교육팀<br>교육생 만족도 체크</div>
            <div class="brand-sub">Zoom 캡처 · 모바일/PC 공용</div>
          </div>
        </div>
        <span class="badge badge-done">WEB</span>
      </div>
      <button class="btn btn-amber" id="new-btn">＋ Zoom 화면 사진으로 새 출석 등록</button>
      <div class="card" style="margin-top:16px;padding:10px 6px;" id="list-wrap"></div>
    `;
    document.getElementById('new-btn').onclick = ()=> renderUpload();
    const wrap = document.getElementById('list-wrap');
    wrap.innerHTML = `<div class="loading-wrap"><div class="spin"></div>불러오는 중...</div>`;
    const idx = await getIndex();
    if(idx.length===0){
      wrap.innerHTML = `<div class="empty"><div class="empty-num">0</div>등록된 출석 기록이 없습니다.<br>위 버튼으로 첫 기록을 만들어보세요.</div>`;
      return;
    }
    wrap.innerHTML = idx.map((e,i)=>`
      <div class="session-item" data-id="${esc(e.id)}">
        <div class="session-idx">${String(idx.length-i).padStart(2,'0')}</div>
        <div class="session-main">
          <div class="session-title">${esc(e.title||'제목 없음')}</div>
          <div class="session-meta">${esc(e.date||'')} · 교육생 ${e.count}명</div>
        </div>
        <div class="badge ${e.done?'badge-done':'badge-pending'}">${e.done?'입력완료':`태도입력 ${e.scoredCount}/${e.count}`}</div>
      </div>
    `).join('');
    wrap.querySelectorAll('.session-item').forEach(el=>{
      el.onclick = ()=> renderDetail(el.dataset.id);
    });
  }

  // ---------- render: upload / OCR view ----------
  function renderUpload(){
    shell.innerHTML = `
      <div class="topbar">
        <button class="back-btn" id="back-btn">← 목록</button>
      </div>
      <div class="card">
        <label class="field-label" style="margin-top:0;">1. Zoom 참가자 화면 사진</label>
        <div id="upload-zone" class="upload-zone">
          <div class="upload-icon">📷</div>
          <div class="upload-txt">사진 촬영 또는 이미지 선택</div>
          <div class="upload-sub">회의 종료 후 참가자 목록 화면을 찍어주세요</div>
        </div>
        <input type="file" id="file-input" accept="image/*" style="display:none;">
        <div id="result-zone"></div>
      </div>
    `;
    document.getElementById('back-btn').onclick = ()=> renderList();
    const zone = document.getElementById('upload-zone');
    const input = document.getElementById('file-input');
    zone.onclick = ()=> input.click();
    input.onchange = async ()=>{
      const file = input.files[0];
      if(!file) return;
      const resultZone = document.getElementById('result-zone');
      resultZone.innerHTML = `<div class="loading-wrap"><div class="spin"></div>사진 준비 중...</div>`;
      let norm;
      try{
        norm = await normalizeImage(file);
      }catch(err){
        resultZone.innerHTML = `<div class="hint" style="color:var(--red);">${esc(err.message || '사진을 불러오지 못했습니다.')}</div>
          <button class="btn btn-outline" id="retry-btn" style="margin-top:10px;">다시 촬영/선택</button>`;
        document.getElementById('retry-btn').onclick = ()=> renderUpload();
        return;
      }
      zone.innerHTML = `<img class="preview-img" src="${norm.dataUrl}">`;
      resultZone.innerHTML = `<div class="loading-wrap"><div class="spin"></div>사진에서 이름·시간 인식 중...</div>`;
      try{
        const parsed = await extractFromImage(norm.base64, norm.mediaType);
        draftStudents = (parsed.students||[]).map(s=>({
          id: uid(), name: s.name||'', affiliation: s.affiliation||'', joinTime: s.joinTime||'', leaveTime: s.leaveTime||'',
          durationMin: s.durationMin||'', score:null, reason:''
        }));
        renderDraftEditor({
          courseName: parsed.courseName || '',
          session: parsed.session || '',
          schedule: parsed.schedule || ''
        });
      }catch(err){
        resultZone.innerHTML = `<div class="hint" style="color:var(--red);">인식에 실패했습니다: ${esc(err.message || '알 수 없는 오류')}</div>
          <div class="row" style="margin-top:10px;">
            <button class="btn btn-outline btn-sm" id="retry-btn">다시 촬영/선택</button>
            <button class="btn btn-outline btn-sm" id="manual-btn">사진 없이 직접 입력</button>
          </div>`;
        document.getElementById('retry-btn').onclick = ()=> renderUpload();
        document.getElementById('manual-btn').onclick = ()=>{
          draftStudents = [];
          renderDraftEditor({courseName:'', session:'', schedule:''});
        };
      }
    };
  }

  function renderDraftEditor(guess){
    const resultZone = document.getElementById('result-zone');
    const today = new Date();
    const todayStr = `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
    resultZone.innerHTML = `
      <label class="field-label">2. 교육과정 정보 확인</label>
      <input type="text" id="course-input" value="${esc(guess.courseName)}" placeholder="교육과정명 (예: [부산] 유선인증과정 BOOST(8월))">
      <input type="text" id="session-input" value="${esc(guess.session)}" placeholder="차수 (숫자만 입력해도 자동으로 '차수'가 붙습니다. 예: 18)" style="margin-top:8px;">
      <input type="text" id="schedule-input" value="${esc(guess.schedule || todayStr)}" placeholder="진행 일정 (예: 2026.08.12)" style="margin-top:8px;">
      <input type="text" id="instructor-input" placeholder="담당 강사" style="margin-top:8px;">
      <div class="hint" style="margin-top:6px;">사진에서 자동으로 읽은 값입니다. 틀렸거나 비어 있으면 직접 고쳐주세요. 저장 후에도 언제든 다시 수정할 수 있습니다.</div>
      <label class="field-label">3. 인식된 교육생 (${draftStudents.length}명) — 필요하면 수정하세요</label>
      <div id="draft-list"></div>
      <button class="btn btn-outline btn-sm" id="add-row-btn" style="margin-top:4px;">+ 교육생 수동 추가</button>
      <div class="hint">이름이 잘못 인식됐거나 빠진 사람이 있으면 직접 고쳐주세요. 점수·사유는 다음 단계에서 입력합니다.</div>
      <button class="btn btn-primary" id="save-draft-btn" style="margin-top:16px;">이 명단으로 저장하기</button>
    `;
    renderDraftRows();
    document.getElementById('add-row-btn').onclick = ()=>{
      draftStudents.push({id:uid(), name:'', affiliation:'', joinTime:'', leaveTime:'', durationMin:'', score:null, reason:''});
      renderDraftRows();
    };
    document.getElementById('save-draft-btn').onclick = async ()=>{
      const courseName = document.getElementById('course-input').value.trim();
      const session = normalizeSession(document.getElementById('session-input').value);
      const schedule = document.getElementById('schedule-input').value.trim() || todayStr;
      const instructor = document.getElementById('instructor-input').value.trim();
      if(courseName===''){ toast('교육과정명을 입력해주세요'); return; }
      const cleaned = draftStudents.filter(s=>s.name.trim()!=='');
      if(cleaned.length===0){ toast('교육생을 최소 1명 입력해주세요'); return; }
      const sess = { id: uid(), courseName, session, instructor, title: buildTitle(courseName, session), date: schedule, students: cleaned };
      const ok = await saveSession(sess);
      toast(ok? '명단이 저장되었습니다. 이어서 태도를 입력해보세요.' : '저장에 실패했습니다');
      if(ok) renderDetail(sess.id);
    };
  }

  // 숫자만 입력하면 자동으로 "차수"를 붙여준다. 이미 "차수"가 붙어 있으면 그대로 둔다.
  function normalizeSession(v){
    v = (v||'').trim();
    if(v==='') return '';
    if(/차수\s*$/.test(v)) return v;
    if(/^\d+$/.test(v)) return v+'차수';
    return v+' 차수';
  }

  function buildTitle(courseName, session){
    courseName = (courseName||'').trim();
    session = (session||'').trim();
    if(!courseName) return '제목 없음';
    if(!session) return courseName;
    return `${courseName} ${session}`;
  }

  // 파일명/이미지 상단 표기용: "과정명_차수_담당강사" 형식
  function buildFileBase(s){
    const parts = [s.courseName || s.title || '교육', s.session || '', s.instructor || ''].filter(p=>p && p.trim()!=='');
    return parts.join('_').replace(/[\\/:*?"<>|]/g,'').trim() || '출석태도';
  }

  function renderDraftRows(){
    const wrap = document.getElementById('draft-list');
    wrap.innerHTML = draftStudents.map((s,i)=>`
      <div class="student-row" data-i="${i}">
        <input type="text" class="dn" value="${esc(s.name)}" placeholder="이름">
        <input type="text" class="da" value="${esc(s.affiliation)}" placeholder="소속">
        <input type="text" class="dt" value="${esc(s.durationMin)}" placeholder="분" style="max-width:48px;flex:none;">
        <button class="rm-btn" data-rm="${i}">✕</button>
      </div>
    `).join('');
    wrap.querySelectorAll('.student-row').forEach(row=>{
      const i = +row.dataset.i;
      row.querySelector('.dn').oninput = e=> draftStudents[i].name = e.target.value;
      row.querySelector('.da').oninput = e=> draftStudents[i].affiliation = e.target.value;
      row.querySelector('.dt').oninput = e=> draftStudents[i].durationMin = e.target.value;
    });
    wrap.querySelectorAll('[data-rm]').forEach(btn=>{
      btn.onclick = ()=>{ draftStudents.splice(+btn.dataset.rm,1); renderDraftRows(); };
    });
  }

  // ---------- render: session detail / score entry ----------
  async function renderDetail(id){
    shell.innerHTML = `
      <div class="topbar"><button class="back-btn" id="back-btn">← 목록</button></div>
      <div class="loading-wrap"><div class="spin"></div>불러오는 중...</div>
    `;
    document.getElementById('back-btn').onclick = ()=> renderList();
    currentSession = await getSession(id);
    if(!currentSession){ toast('기록을 찾을 수 없습니다'); renderList(); return; }
    drawDetail();
  }

  function drawDetail(){
    const s = currentSession;
    const scored = s.students.filter(st=>st.score!==null && st.score!=='' && st.score!==undefined).length;
    shell.innerHTML = `
      <div class="topbar">
        <button class="back-btn" id="back-btn">← 목록</button>
        <button class="btn-danger-ghost" id="del-btn">삭제</button>
      </div>
      <div class="card" style="padding-bottom:14px;">
        <div id="title-view">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">
            <div style="font-size:16px;font-weight:800;color:var(--navy-deep);">${esc(s.title)}</div>
            <button class="btn-ghost btn-sm" id="edit-title-btn" style="flex-shrink:0;">수정</button>
          </div>
          <div class="session-meta" style="margin-top:2px;">${esc(s.date)}${s.instructor? ' · 담당 강사 '+esc(s.instructor) : ''}</div>
        </div>
        <div class="stat-strip" style="margin-top:14px;">
          <div class="stat-box"><div class="stat-num">${s.students.length}</div><div class="stat-lbl">교육생</div></div>
          <div class="stat-box"><div class="stat-num">${scored}</div><div class="stat-lbl">입력완료</div></div>
          <div class="stat-box"><div class="stat-num">${s.students.length-scored}</div><div class="stat-lbl">미입력</div></div>
        </div>
      </div>
      <div id="score-list"></div>
      <div class="fab-export">
        <div class="row" style="margin-bottom:8px;">
          <button class="btn btn-primary" id="save-btn">저장</button>
        </div>
        <div class="row">
          <button class="btn btn-outline" id="export-xlsx-btn">엑셀로 내보내기</button>
          <button class="btn btn-outline" id="export-img-btn">이미지로 저장</button>
        </div>
      </div>
    `;
    document.getElementById('back-btn').onclick = ()=> renderList();
    document.getElementById('edit-title-btn').onclick = ()=>{
      const tv = document.getElementById('title-view');
      tv.innerHTML = `
        <label class="field-label" style="margin-top:0;">교육과정명</label>
        <input type="text" id="edit-course" value="${esc(s.courseName || s.title || '')}" placeholder="교육과정명">
        <label class="field-label">차수</label>
        <input type="text" id="edit-session" value="${esc(s.session || '')}" placeholder="숫자만 입력해도 자동으로 '차수'가 붙습니다. 예: 18">
        <label class="field-label">진행 일정</label>
        <input type="text" id="edit-schedule" value="${esc(s.date || '')}" placeholder="예: 2026.08.12">
        <label class="field-label">담당 강사</label>
        <input type="text" id="edit-instructor" value="${esc(s.instructor || '')}" placeholder="담당 강사">
        <div class="row" style="margin-top:10px;">
          <button class="btn btn-outline btn-sm" id="cancel-title-btn">취소</button>
          <button class="btn btn-primary btn-sm" id="confirm-title-btn">확인</button>
        </div>
      `;
      document.getElementById('cancel-title-btn').onclick = ()=> drawDetail();
      document.getElementById('confirm-title-btn').onclick = async ()=>{
        const courseName = document.getElementById('edit-course').value.trim();
        const session = normalizeSession(document.getElementById('edit-session').value);
        const schedule = document.getElementById('edit-schedule').value.trim();
        const instructor = document.getElementById('edit-instructor').value.trim();
        if(courseName===''){ toast('교육과정명을 입력해주세요'); return; }
        if(schedule===''){ toast('진행 일정을 입력해주세요'); return; }
        s.courseName = courseName;
        s.session = session;
        s.title = buildTitle(courseName, session);
        s.date = schedule;
        s.instructor = instructor;
        const ok = await saveSession(s);
        toast(ok?'수정되었습니다':'수정 실패');
        drawDetail();
      };
    };
    document.getElementById('del-btn').onclick = async ()=>{
      if(confirm('이 출석 기록을 삭제할까요? 되돌릴 수 없습니다.')){
        await deleteSession(s.id); toast('삭제되었습니다'); renderList();
      }
    };
    document.getElementById('save-btn').onclick = async ()=>{
      const ok = await saveSession(currentSession);
      toast(ok?'저장되었습니다':'저장 실패');
      if(ok) drawDetail();
    };
    document.getElementById('export-xlsx-btn').onclick = exportXlsx;
    document.getElementById('export-img-btn').onclick = exportImage;

    const list = document.getElementById('score-list');
    list.innerHTML = s.students.map((st,i)=>{
      const filled = st.score!==null && st.score!=='' && st.score!==undefined;
      return `
      <div class="score-card ${filled?'filled':''}" data-i="${i}">
        <div class="sc-head">
          <div style="flex:1;min-width:0;">
            <div class="sc-name">${esc(st.name)}</div>
            <input type="text" class="sc-affil" value="${esc(st.affiliation)}" placeholder="소속 (예: 다울 본점)">
          </div>
          <div class="sc-time">${esc(st.durationMin)?esc(st.durationMin)+'분 참여':''}</div>
        </div>
        <div class="chip-row">
          ${REASON_PRESETS.map(p=>`<span class="chip ${st.score==p.score?'active':''}" data-preset="${p.score}">${p.label}</span>`).join('')}
        </div>
        <div class="score-input-row">
          <input type="number" min="0" max="100" class="sc-score" value="${st.score!==null&&st.score!==undefined?st.score:''}" placeholder="점수">
          <span>점</span>
        </div>
        <textarea class="sc-reason" placeholder="사유 (프리셋 선택 시 자동 입력, 직접 수정 가능)">${esc(st.reason)}</textarea>
      </div>`;
    }).join('');

    list.querySelectorAll('.score-card').forEach(card=>{
      const i = +card.dataset.i;
      card.querySelectorAll('.chip').forEach(chip=>{
        chip.onclick = ()=>{
          const preset = REASON_PRESETS.find(p=>p.score===+chip.dataset.preset);
          s.students[i].score = preset.score;
          s.students[i].reason = preset.reason;
          drawDetail();
        };
      });
      card.querySelector('.sc-score').oninput = e=>{
        const v = e.target.value;
        s.students[i].score = v===''? null : Math.max(0, Math.min(100, +v));
      };
      card.querySelector('.sc-reason').oninput = e=>{ s.students[i].reason = e.target.value; };
      card.querySelector('.sc-affil').oninput = e=>{ s.students[i].affiliation = e.target.value; };
    });
  }

  // ---------- export: excel ----------
  async function exportXlsx(){
    const s = currentSession;
    const fileBase = buildFileBase(s);
    try{
      const resp = await fetch('/api/export-xlsx', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ session: s, fileBase })
      });
      if(!resp.ok){
        let msg = 'Excel 생성에 실패했습니다';
        try{ const e = await resp.json(); if(e && e.error) msg = e.error; }catch(_){}
        throw new Error(msg);
      }
      const blob = await resp.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${fileBase}.xlsx`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 1500);
      toast('Excel이 저장되었습니다');
    }catch(e){
      console.error('xlsx export fail', e);
      exportCsvFallback();
      toast('Excel 서버 연결 실패로 CSV로 저장했습니다');
    }
  }

  function csvEscape(v){
    const s = (v===undefined||v===null?'':String(v));
    return '"'+s.replace(/"/g,'""')+'"';
  }
  function exportCsvFallback(){
    const s = currentSession;
    const fileBase = buildFileBase(s);
    const rows = [
      ['이름','소속','참가시간','나간시간','참여시간(분)','점수','사유'],
      ...s.students.map(st=>[st.name, st.affiliation, st.joinTime, st.leaveTime, st.durationMin, st.score, st.reason])
    ];
    const csv = '\uFEFF' + rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=`${fileBase}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
  }

  // ---------- export: image (drawn directly on canvas, no external lib) ----------
  function wrapText(ctx, text, maxWidth){
    text = text || '';
    if(text==='') return [''];
    const lines = [];
    let line = '';
    for(const ch of text){
      const test = line + ch;
      if(ctx.measureText(test).width > maxWidth && line !== ''){
        lines.push(line);
        line = ch;
      }else{
        line = test;
      }
    }
    if(line !== '') lines.push(line);
    return lines.length ? lines : [''];
  }

  function downloadDataUrl(dataUrl, filename){
    const link = document.createElement('a');
    link.href = dataUrl;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function exportImage(){
    const s = currentSession;
    const fileBase = buildFileBase(s);
    const SCALE = 2; // retina-ish output
    const W = 700;
    const PAD = 26;
    const colName = 84, colAffil = 84, colDur = 58, colScore = 44;
    const colReason = W - PAD*2 - colName - colAffil - colDur - colScore;
    const lineH = 16;
    const rowPadV = 10;
    const headerH = 92;   // title + date block
    const tableHeadH = 32;

    // measure with a scratch canvas first
    const meas = document.createElement('canvas').getContext('2d');
    meas.font = '12px -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
    const rows = s.students.map(st=>{
      const scoreTxt = (st.score!==null && st.score!==undefined && st.score!=='') ? String(st.score) : '-';
      const durTxt = st.durationMin!==undefined && st.durationMin!==null && st.durationMin!=='' ? `${st.durationMin}분` : '-';
      const reasonLines = wrapText(meas, st.reason || '-', colReason - 12);
      const rowH = Math.max(lineH*2 + rowPadV, reasonLines.length*lineH + rowPadV);
      return {name: st.name||'', affiliation: st.affiliation||'-', durTxt, scoreTxt, reasonLines, rowH};
    });
    const totalH = headerH + tableHeadH + rows.reduce((a,r)=>a+r.rowH,0) + PAD;

    const canvas = document.createElement('canvas');
    canvas.width = W*SCALE;
    canvas.height = totalH*SCALE;
    const ctx = canvas.getContext('2d');
    ctx.scale(SCALE, SCALE);

    // background
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0,0,W,totalH);

    // header
    ctx.fillStyle = '#1E1B4B';
    ctx.font = '800 19px -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
    ctx.fillText(fileBase, PAD, 36);
    ctx.fillStyle = '#6B7280';
    ctx.font = '600 12px -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
    ctx.fillText(`${s.date || ''} · 교육생 ${s.students.length}명`, PAD, 56);
    ctx.strokeStyle = '#E7E9F5';
    ctx.beginPath(); ctx.moveTo(PAD, 70); ctx.lineTo(W-PAD, 70); ctx.stroke();

    // table header
    let y = headerH;
    ctx.fillStyle = '#4F46E5';
    ctx.fillRect(PAD, y, W-PAD*2, tableHeadH);
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '700 12px -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
    ctx.fillText('이름', PAD+10, y+20);
    ctx.fillText('소속', PAD+colName+10, y+20);
    ctx.fillText('참여시간', PAD+colName+colAffil+10, y+20);
    ctx.fillText('점수', PAD+colName+colAffil+colDur+10, y+20);
    ctx.fillText('사유', PAD+colName+colAffil+colDur+colScore+10, y+20);
    y += tableHeadH;

    rows.forEach((r,i)=>{
      ctx.fillStyle = i%2 ? '#F5F6FF' : '#FFFFFF';
      ctx.fillRect(PAD, y, W-PAD*2, r.rowH);
      ctx.fillStyle = '#1F2430';
      ctx.font = '700 12.5px -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
      ctx.fillText(r.name, PAD+10, y+18);
      ctx.font = '500 11.5px -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
      ctx.fillStyle = '#6B7280';
      ctx.fillText(r.affiliation, PAD+colName+10, y+18);
      ctx.fillText(r.durTxt, PAD+colName+colAffil+10, y+18);
      ctx.fillStyle = '#1F2430';
      ctx.font = '700 12.5px -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
      ctx.fillText(r.scoreTxt, PAD+colName+colAffil+colDur+10, y+18);
      ctx.font = '500 11.5px -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
      ctx.fillStyle = '#374151';
      r.reasonLines.forEach((ln,li)=> ctx.fillText(ln, PAD+colName+colAffil+colDur+colScore+10, y+18+li*lineH));
      ctx.strokeStyle = '#E7E9F5';
      ctx.beginPath(); ctx.moveTo(PAD, y+r.rowH); ctx.lineTo(W-PAD, y+r.rowH); ctx.stroke();
      y += r.rowH;
    });

    try{
      const dataUrl = canvas.toDataURL('image/png');
      downloadDataUrl(dataUrl, `${fileBase}.png`);
      toast('이미지가 저장되었습니다');
    }catch(e){
      console.error('image export fail', e);
      toast('이미지 생성에 실패했습니다');
    }
  }

  renderList();
})();
</script>
