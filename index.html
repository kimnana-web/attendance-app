<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#4F46E5">
<title>천하무적동부교육팀 교육생 만족도 체크</title>
<style>
  :root{
    --navy:#4F46E5;
    --navy-deep:#1E1B4B;
    --amber:#F59E0B;
    --teal:#10B981;
    --red:#EF4444;
    --paper:#F3F4FD;
    --card:#FFFFFF;
    --ink:#1F2430;
    --sub:#6B7280;
    --line:#E7E9F5;
    --shadow: 0 1px 2px rgba(30,27,75,.04), 0 8px 24px rgba(79,70,229,.07);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;background:#F3F4FD;}
  body{min-height:100vh;}
  #app-root{
    font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo','Segoe UI',sans-serif;
    background:radial-gradient(circle at 12% 0%, #EEF0FF 0%, var(--paper) 42%);
    color:var(--ink);
    min-height:100%;
    padding:0;
    line-height:1.5;
    letter-spacing:-0.01em;
  }
  .shell{max-width:520px;margin:0 auto;padding:18px 16px 60px;}
  .topbar{
    display:flex;align-items:flex-start;justify-content:space-between;
    padding:14px 4px 18px;
  }
  .brand{display:flex;align-items:flex-start;gap:10px;}
  .brand-mark{

  .back-btn{

  }
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;

  .btn{

  .btn-teal{background:var(--teal);color:#fff;}
  .btn-outline{background:#fff;color:var(--navy);border:1.5px solid var(--line);}

  .row{display:flex;gap:8px;}

  .empty-num{font-size:34px;font-weight:800;color:var(--line);margin-bottom:6px;}
  .session-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;
    border-radius:10px;

  .session-item:active{background:#F5F6FF;}
  .session-item:last-child{border-bottom:none;}
  .session-idx{
    font-size:11px;font-weight:800;color:var(--amber);width:22px;flex-shrink:0;
  }
  .session-main{flex:1;min-width:0;}
  .session-title{font-size:14px;font-weight:700;color:var(--navy-deep);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .session-meta{font-size:11.5px;color:var(--sub);margin-top:2px;}
  .badge{
    font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:20px;flex-shrink:0;
  }
  .badge-done{background:#DCFCE7;color:#15803D;}
  .badge-pending{background:#FEF3C7;color:#B45309;}
  label.field-label{
    display:block;font-size:12px;font-weight:700;color:var(--sub);
    margin-bottom:6px;margin-top:14px;
  }
  label.field-label:first-child{margin-top:0;}
  input[type=text], input[type=number], textarea{
    width:100%;border:1.5px solid var(--line);border-radius:11px;
    padding:10px 11px;font-size:14px;font-family:inherit;color:var(--ink);

  .upload-zone{
    border:2px dashed #C7D2FE;border-radius:16px;padding:34px 16px;

  .upload-txt{font-size:13.5px;font-weight:700;color:var(--navy);}

  .preview-img{width:100%;border-radius:12px;border:1px solid var(--line);margin-bottom:12px;}
  .student-row{
    border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;

  .student-row input{flex:1;}
  .student-row.triplet{
    display:grid;

  .student-head-grid{
    display:grid;

  @media(max-width:470px){

  .rm-btn{
    width:28px;height:28px;border-radius:9px;border:none;background:#FEE2E2;
    color:var(--red);font-weight:800;cursor:pointer;flex-shrink:0;
  }
  .stat-strip{display:flex;gap:8px;margin-bottom:14px;}
  .stat-box{
    flex:1;background:#F8F9FF;border:1px solid var(--line);border-radius:13px;
    padding:10px;text-align:center;
  }
  .stat-num{font-size:19px;font-weight:800;color:var(--navy-deep);}
  .stat-lbl{font-size:10.5px;color:var(--sub);margin-top:2px;}
  .score-card{
    border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:10px;background:#fff;
    box-shadow:0 1px 2px rgba(30,27,75,.03);

  .score-card.filled{border-color:#A7F3D0;background:#F5FEFA;}
  .sc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .sc-name{font-size:14.5px;font-weight:800;color:var(--navy-deep);}
  .sc-affil{
    margin-top:3px;width:100%;border:none;border-bottom:1px dashed var(--line);
    padding:2px 0;font-size:11.5px;color:var(--sub);background:transparent;border-radius:0;
  }
  .sc-affil:focus{outline:none;border-bottom-color:var(--navy);}
  .sc-time{font-size:11px;color:var(--sub);white-space:nowrap;flex-shrink:0;padding-top:2px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
  .chip{
    font-size:11.5px;font-weight:700;padding:6px 10px;border-radius:20px;
    border:1.5px solid var(--line);background:#fff;cursor:pointer;color:var(--ink);
  }
  .chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  .score-input-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .score-input-row input{width:70px;flex:none;text-align:center;font-weight:800;}
  .score-input-row span{font-size:12px;color:var(--sub);font-weight:600;}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:var(--navy-deep);color:#fff;padding:11px 20px;border-radius:30px;
    font-size:13px;font-weight:700;z-index:999;box-shadow:0 10px 24px rgba(30,27,75,.35);
  }
  .spin{
    width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);
    border-top-color:#fff;animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-wrap{display:flex;align-items:center;justify-content:center;gap:10px;padding:26px 0;color:var(--sub);font-size:13px;font-weight:600;}
  .hint{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.55;}
  .fab-export{
    position:sticky;bottom:0;background:linear-gradient(0deg,var(--paper) 60%,transparent);
    padding:14px 0 4px;margin-top:6px;
  }
</style>

<body>
<div style="position:fixed;right:10px;bottom:10px;z-index:99999;background:#111827;color:#fff;padding:7px 10px;border-radius:999px;font:700 11px/1.2 -apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.18);">V6 · 소속 지역명 자동정리 · 참여시간 수기입력</div>

<div id="app-root">
  <div class="shell" id="shell"></div>
</div>

<!-- 서버 API 없이 브라우저 안에서 OCR 실행 -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>
console.log('attendance-app V6 - marketing team region parsing + manual duration');
(function(){
  try{ document.title = '천하무적동부교육팀 교육생 만족도 체크'; }catch(e){}
  const shell = document.getElementById('shell');
  let view = 'list';
  let currentSession = null;   // full session object in memory while editing
  let draftStudents = null;    // editable extraction result before first save

  const REASON_PRESETS = [
    {score:100, label:'적극 참여', reason:'적극 참여, 높은 몰입도, 활발한 소통'},
    {score:90,  label:'성실 참여', reason:'성실히 참여, 원활한 소통'},
    {score:80,  label:'다소 제한적', reason:'참여했으나 의견공유, 상호작용이 다소 제한적'},
    {score:70,  label:'참여 저조', reason:'참여 저조, 집중도 낮음'},
    {score:60,  label:'참여 미흡', reason:'참여 거의 없음, 카메라/음성 응답 미확인'},
  ];

  // ---------- storage helpers ----------
  // 공개 웹 배포 버전: 기록은 각 사용자의 브라우저 localStorage에 저장됩니다.
  // 따라서 같은 URL을 사용해도 기기/브라우저별 기록은 서로 섞이지 않습니다.
  async function kvGet(key){
    try{ return window.localStorage.getItem(key); }catch(e){ return null; }
  }
  async function kvSet(key, value){
    try{ window.localStorage.setItem(key, value); return true; }
    catch(e){ console.error('kvSet fail', e); return false; }
  }
  async function kvDelete(key){
    try{ window.localStorage.removeItem(key); }catch(e){}
  }

  async function getIndex(){
    try{
      const v = await kvGet('session-index');
      return v ? JSON.parse(v) : [];
    }catch(e){ return []; }
  }
  async function saveIndex(idx){
    try{ await kvSet('session-index', JSON.stringify(idx)); }
    catch(e){ console.error('index save fail', e); }
  }
  async function getSession(id){
    try{
      const v = await kvGet('session:'+id);
      if(!v) return null;
      const s = JSON.parse(v);
      s.students = (s.students||[]).map(normalizeStudentRecord);
      return s;
    }catch(e){ return null; }
  }
  async function saveSession(sess){
    try{
      const ok = await kvSet('session:'+sess.id, JSON.stringify(sess));
      if(!ok) return false;
      let idx = await getIndex();
      const scoredCount = sess.students.filter(s=>s.score!==null && s.score!==undefined && s.score!=='').length;
      const entry = {
        id:sess.id, title:sess.title, date:sess.date,
        count:sess.students.length, scoredCount,
        done: scoredCount===sess.students.length && sess.students.length>0
      };
      idx = idx.filter(e=>e.id!==sess.id);
      idx.unshift(entry);
      await saveIndex(idx);
      return true;
    }catch(e){ console.error('save fail', e); return false; }
  }
  async function deleteSession(id){
    try{
      await kvDelete('session:'+id);
      let idx = await getIndex();
      idx = idx.filter(e=>e.id!==id);
      await saveIndex(idx);
    }catch(e){ console.error('delete fail', e); }
  }


  function canonical(v){
    return String(v||'')
      .toLowerCase()
      .replace(/\s+/g,'')
      .replace(/[()[\]{}_\-.,:;/'"\\]/g,'')
      .trim();
  }

  function canonicalName(v){
    return String(v||'').replace(/[^가-힣A-Za-z]/g,'').toLowerCase();
  }

  function canonicalDate(v){
    return String(v||'').replace(/[^\d]/g,'');
  }

  function sessionKey(courseName, session, date){
    return [canonical(courseName), canonical(session), canonicalDate(date)].join('|');
  }

  // 기존 구버전의 "소속" 한 칸에 "대리점 + 매장명"이 함께 들어 있던 데이터를
  // 새 구조(소속/매장명)로 최대한 안전하게 분리한다.
  function extractMarketingRegion(raw){
    raw = String(raw || '')
      .replace(/[|•●■□◆◇▶►※]/g,' ')
      .replace(/\s+/g,' ')
      .trim();

    if(!raw) return '';

    // 예:
    // 동대구마케팅팀 -> 동대구
    // 경북마케팅팀 -> 경북
    // 서대구 마케팅팀 -> 서대구
    // 한 줄에 마케팅팀 정보가 2개 이상 잡히면 두 번째 값을 우선 사용
    const matches = [...raw.matchAll(/([가-힣]{2,10})\s*마케팅팀/g)]
      .map(m => (m[1] || '').trim())
      .filter(Boolean);

    if(matches.length >= 2) return matches[1];
    if(matches.length === 1) return matches[0];

    return '';
  }

  function splitAffiliationStore(raw){
    raw = String(raw||'')
      .replace(/[|•●■□◆◇▶►※]/g,' ')
      .replace(/\s+/g,' ')
      .trim();

    if(!raw) return {affiliation:'', storeName:''};

    // 소속은 '○○마케팅팀'에서 지역명만 가져온다.
    // 한 줄에 마케팅팀 값이 2개라면 두 번째 값을 우선 사용한다.
    const marketingRegion = extractMarketingRegion(raw);

    // 매장명 판별용으로 '○○마케팅팀' 문자열은 제거
    let storeSource = raw.replace(/[가-힣]{2,10}\s*마케팅팀/g,' ').replace(/\s+/g,' ').trim();

    // "레이스대리점율하점"처럼 붙어서 인식된 경우
    const dealerAttached = storeSource.match(/^(.+?대리점)\s*(.+)$/);
    if(dealerAttached){
      const rest = dealerAttached[2].trim();
      if(rest && /(점|본점|지점|센터|매장|스토어|플라자)$/.test(rest)){
        return {
          affiliation: marketingRegion,
          storeName: rest
        };
      }
    }

    const tokens = storeSource.split(' ').filter(Boolean);
    const last = tokens[tokens.length-1] || '';
    const storePattern = /(점|본점|지점|직영점|센터|매장|스토어|플라자)$/;

    if(tokens.length >= 2 && storePattern.test(last)){
      return {
        affiliation: marketingRegion,
        storeName: last.trim()
      };
    }

    if(tokens.length === 1 && storePattern.test(storeSource)){
      return {
        affiliation: marketingRegion,
        storeName: storeSource
      };
    }

    // 매장명이 애매하더라도 소속 지역은 마케팅팀 값에서 정확히 분리
    return {
      affiliation: marketingRegion,
      storeName: storeSource
    };
  }

  function normalizeStudentRecord(st){
    st = st || {};
    const rawAffiliation = String(st.organization || st.affiliationOrg || st.affiliation || '').trim();
    const rawStore = String(st.storeName || '').trim();

    const combinedForParsing = [rawAffiliation, rawStore].filter(Boolean).join(' ');
    const split = splitAffiliationStore(combinedForParsing);

    // 기존에 '동대구마케팅팀'처럼 저장된 값도 '동대구'로 정리
    const directRegion = extractMarketingRegion(rawAffiliation);

    return {
      id: st.id || uid(),
      affiliation: String(directRegion || split.affiliation || '').trim(),
      storeName: String(rawStore || split.storeName || '').trim(),
      name: String(st.name || '').trim(),
      score: st.score===undefined ? null : st.score,
      reason: st.reason || '',
      joinTime: st.joinTime || '',
      leaveTime: st.leaveTime || '',
      durationMin: st.durationMin || ''
    };
  }

  function mergeStudents(baseStudents, newStudents){
    const byName = new Map();

    const put = (raw, preferExisting)=>{
      const st = normalizeStudentRecord(raw);
      const key = canonicalName(st.name);
      if(!key) return;

      if(!byName.has(key)){
        byName.set(key, st);
        return;
      }

      const old = byName.get(key);
      const merged = {
        ...old,
        // 기존 강사 수정값/평가값을 우선 보존
        affiliation: old.affiliation || st.affiliation,
        storeName: old.storeName || st.storeName,
        name: old.name || st.name,
        score: (old.score!==null && old.score!==undefined && old.score!=='') ? old.score : st.score,
        reason: old.reason || st.reason,
        joinTime: old.joinTime || st.joinTime,
        leaveTime: old.leaveTime || st.leaveTime,
        durationMin: old.durationMin || st.durationMin
      };
      byName.set(key, merged);
    };

    (baseStudents||[]).forEach(s=>put(s,true));
    (newStudents||[]).forEach(s=>put(s,false));
    return Array.from(byName.values());
  }

  async function findExistingSession(courseName, session, date){
    const target = sessionKey(courseName, session, date);
    const idx = await getIndex();
    for(const e of idx){
      const s = await getSession(e.id);
      if(!s) continue;
      if(sessionKey(s.courseName || '', s.session || '', s.date || '') === target){
        return s;
      }
    }
    return null;
  }

  // 이전 버전에서 같은 과정/차수/날짜가 여러 번 저장된 경우 자동으로 한 건으로 합친다.
  async function consolidateDuplicateSessions(){
    const idx = await getIndex();
    if(idx.length < 2) return;

    const groups = new Map();
    let changed = false;

    for(const entry of idx){
      const s = await getSession(entry.id);
      if(!s) continue;

      s.students = mergeStudents([], s.students || []);
      const key = sessionKey(s.courseName || '', s.session || '', s.date || '');

      if(!groups.has(key)){
        groups.set(key, s);
      }else{
        const keep = groups.get(key);
        keep.students = mergeStudents(keep.students, s.students);
        keep.instructor = keep.instructor || s.instructor || '';
        await kvDelete('session:'+s.id);
        changed = true;
      }
    }

    if(!changed) return;

    const newIdx = [];
    for(const s of groups.values()){
      await kvSet('session:'+s.id, JSON.stringify(s));
      const scoredCount = s.students.filter(st=>st.score!==null && st.score!==undefined && st.score!=='').length;
      newIdx.push({
        id:s.id,
        title:s.title,
        date:s.date,
        count:s.students.length,
        scoredCount,
        done:scoredCount===s.students.length && s.students.length>0
      });
    }
    await saveIndex(newIdx);
  }


  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function toast(msg){
    const t=document.createElement('div');
    t.className='toast'; t.textContent=msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 2200);
  }
  function esc(s){
    return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- 브라우저 OCR ----------
  // 서버 API / API Key / Vercel Function을 사용하지 않습니다.
  // 이미지 문자인식은 사용자의 브라우저에서 Tesseract.js로 실행됩니다.

  const OCR_STOPWORDS = new Set([
    '참가자','참가자목록','참가','목록','이름','회의','회의정보','대기실','호스트',
    '교육강사','강사','나','초대','모두음소거','음소거','비디오','오디오',
    '채팅','반응','화면공유','보안','기록','종료','나가기','검색','더보기',
    'zoom','ZOOM','Zoom','SIA','sia'
  ]);

  function cleanOcrLine(line){
    return String(line || '')
      .replace(/[|•●■□◆◇▶►※]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function normalizeKoreanName(raw){
    let s = String(raw || '').trim();
    s = s.replace(/의\s*(iPad|iPhone|Galaxy|Android|Phone|PC|Mac).*$/i, '');
    s = s.replace(/[^\uAC00-\uD7A3]/g, '');
    return /^[가-힣]{2,4}$/.test(s) ? s : '';
  }

  function looksLikeUiLine(line){
    const compact = line.replace(/\s/g,'');
    if(!compact) return true;
    if(/^\d{1,2}[:.]\d{2}/.test(line)) return true;
    if(/^\d+%?$/.test(compact)) return true;
    for(const w of OCR_STOPWORDS){
      if(compact === String(w).replace(/\s/g,'')) return true;
    }
    if(/참가자|대기실|모두\s*음소거|화면\s*공유|회의\s*종료|오디오|비디오/i.test(line)) return true;
    return false;
  }

  function extractCourseMeta(text){
    const lines = String(text || '')
      .split(/\r?\n/)
      .map(cleanOcrLine)
      .filter(Boolean);

    let courseName = '';
    let session = '';
    let schedule = '';
    let instructor = '';

    for(const line of lines){
      if(!session){
        const m = line.match(/(\d{1,3})\s*차수/);
        if(m) session = m[1];
      }

      if(!schedule){
        const d = line.match(/(20\d{2}[.\-/]\s*\d{1,2}[.\-/]\s*\d{1,2}|\d{1,2}[.\-/]\s*\d{1,2}[.\-/]\s*20\d{2})/);
        if(d) schedule = d[1].replace(/\s/g,'');
      }

      if(!instructor){
        let m = line.match(/(?:담당\s*)?강사(?:명)?\s*[:：\-]?\s*([가-힣]{2,4})/);
        if(!m) m = line.match(/([가-힣]{2,4})\s*강사(?:님)?/);
        if(m && !/교육|담당|진행|회의/.test(m[1])) instructor = m[1];
      }
    }

    // 과정명은 참가자/교육생 줄을 절대 사용하지 않고,
    // "과정/교육/BOOST/NPS/Btv/max" 등 과정명 성격이 있는 줄에서만 선택
    const candidates = lines.filter(line =>
      /교육|과정|BOOST|NPS|Btv|max|인증/i.test(line) &&
      !/참가자|교육생|학습자|대기실|호스트|담당\s*강사/i.test(line) &&
      !looksLikeUiLine(line)
    );

    if(candidates.length){
      courseName = candidates[0]
        .replace(/\d{1,3}\s*차수.*$/,'')
        .replace(/20\d{2}[.\-/]\s*\d{1,2}[.\-/]\s*\d{1,2}.*$/,'')
        .trim();
    }

    return {courseName, session, schedule, instructor};
  }

  function parseStudentsFromOcr(text){
    const lines = String(text || '')
      .split(/\r?\n/)
      .map(cleanOcrLine)
      .filter(Boolean);

    const byName = new Map();

    function trailingKoreanName(tokens){
      if(!tokens.length) return '';

      // 일반적인 "김세현"
      const last = tokens[tokens.length-1].replace(/[^가-힣]/g,'');
      if(/^[가-힣]{2,4}$/.test(last)) return last;

      // OCR이 "김 세 현"처럼 이름을 한 글자씩 띄운 경우
      const chars = [];
      for(let i=tokens.length-1; i>=0 && chars.length<4; i--){
        const t = tokens[i].replace(/[^가-힣]/g,'');
        if(/^[가-힣]$/.test(t)) chars.unshift(t);
        else break;
      }
      const joined = chars.join('');
      if(/^[가-힣]{2,4}$/.test(joined)) return joined;

      return '';
    }

    for(let line of lines){
      if(looksLikeUiLine(line)) continue;

      // 과정 정보 / 날짜 / 차수 / 강사 정보는 학생으로 인식하지 않는다.
      if(/과정명|교육과정|진행\s*일정|날짜|차수|담당\s*강사|강사명/.test(line)) continue;
      if(/20\d{2}[.\-/]\s*\d{1,2}[.\-/]\s*\d{1,2}/.test(line)) continue;

      // Zoom의 상태/아이콘/시간 문자열 제거
      line = line
        .replace(/\b\d{1,2}:\d{2}(?::\d{2})?\b/g,' ')
        .replace(/\b\d+\s*(분|초|minutes?|mins?)\b/gi,' ')
        .replace(/\b(예|아니오|Yes|No|음소거됨|음소거해제|Unmute|Mute)\b/gi,' ')
        .replace(/[|•●■□◆◇▶►※]/g,' ')
        .replace(/\s+/g,' ')
        .trim();

      if(!line) continue;
      if(/강사|SIA|HOST|호스트/i.test(line)) continue;

      // "(문혜인의 iPad)" 같은 경우
      const deviceMatch = line.match(/([가-힣]{2,4})의\s*(?:iPad|iPhone|Galaxy|Android|Phone|PC|Mac)/i);
      let name = deviceMatch ? normalizeKoreanName(deviceMatch[1]) : '';

      let noParen = line
        .replace(/\([^)]*\)/g,' ')
        .replace(/\[[^\]]*\]/g,' ')
        .replace(/\s+/g,' ')
        .trim();

      let tokens = noParen.split(/\s+/).filter(Boolean);

      if(!name){
        name = trailingKoreanName(tokens);
      }

      if(!name) continue;
      if(OCR_STOPWORDS.has(name)) continue;
      if(/대리점|본점|지점|센터|매장|교육|강사|참가자|학습자|교육생/.test(name)) continue;

      // 이름이 "김 세 현"처럼 띄어진 경우도 prefix를 정확히 잘라낸다.
      let prefix = noParen;
      const compactNamePattern = name.split('').join('\\s*');
      try{
        prefix = prefix.replace(new RegExp(compactNamePattern + '\\s*$'), '').trim();
      }catch(e){
        const idx = prefix.lastIndexOf(name);
        if(idx >= 0) prefix = prefix.slice(0,idx).trim();
      }

      prefix = prefix
        .replace(/^[\-\d.\s]+/,'')
        .replace(/\b(호스트|Host|HOST)\b/gi,'')
        .replace(/\s+/g,' ')
        .trim();

      if(!prefix) continue;

      const split = splitAffiliationStore(prefix);

      // 너무 긴 UI 문자열은 매장으로 보지 않는다.
      if((split.storeName||'').length > 30) continue;

      const student = normalizeStudentRecord({
        name,
        affiliation: split.affiliation,
        storeName: split.storeName,
        durationMin:'',
        score:null,
        reason:''
      });

      const key = canonicalName(student.name);
      if(!key) continue;

      if(!byName.has(key)){
        byName.set(key, student);
      }else{
        const old = byName.get(key);
        // 더 구체적인 매장/소속 값 우선
        if(!old.affiliation && student.affiliation) old.affiliation = student.affiliation;
        if(!old.storeName && student.storeName) old.storeName = student.storeName;
        byName.set(key, old);
      }
    }

    return Array.from(byName.values());
  }

  async function extractFromImage(base64, mediaType, onProgress){
    if(typeof Tesseract === 'undefined'){
      throw new Error('문자인식 프로그램을 불러오지 못했습니다. 인터넷 연결 또는 회사 보안망에서 jsDelivr 접속이 가능한지 확인해주세요.');
    }

    const dataUrl = `data:${mediaType || 'image/jpeg'};base64,${base64}`;
    let result;
    try{
      const worker = await Tesseract.createWorker('kor+eng', 1, {
        logger: m=>{
          if(typeof onProgress === 'function'){
            const pct = typeof m.progress === 'number' ? Math.round(m.progress * 100) : null;
            const statusMap = {
              'loading tesseract core':'문자인식 엔진 준비 중',
              'initializing tesseract':'문자인식 엔진 초기화 중',
              'loading language traineddata':'한글 인식 데이터 불러오는 중',
              'initializing api':'한글 인식 준비 중',
              'recognizing text':'매장명과 이름을 읽는 중'
            };
            onProgress(statusMap[m.status] || '사진 분석 중', pct);
          }
        }
      });
      await worker.setParameters({
        preserve_interword_spaces: '1',
        user_defined_dpi: '300',
        tessedit_pageseg_mode: '6'
      });
      result = await worker.recognize(dataUrl);
      await worker.terminate();
    }catch(e){
      console.error('Browser OCR error:', e);
      throw new Error('사진 문자인식에 실패했습니다. 인터넷 연결을 확인하고, 가능하면 화면 캡처 이미지를 다시 올려주세요.');
    }

    const text = result?.data?.text || '';
    if(!text.trim()){
      throw new Error('사진에서 글자를 읽지 못했습니다. 글자가 크게 보이도록 화면을 캡처해서 다시 시도해주세요.');
    }

    const students = parseStudentsFromOcr(text);
    const meta = extractCourseMeta(text);

    if(students.length === 0){
      throw new Error('교육생 이름을 자동으로 찾지 못했습니다. 아래의 "사진 없이 직접 입력"을 눌러 입력하거나, 이름이 크게 보이는 캡처로 다시 시도해주세요.');
    }

    return {
      courseName: meta.courseName || '',
      session: meta.session || '',
      schedule: meta.schedule || '',
      instructor: meta.instructor || '',
      students,
      _ocrText: text
    };
  }

  // 카메라 원본 사진은 용량이 크고 일부 폰은 HEIC 등 API가 지원하지 않는 포맷으로 찍히므로,
  // 캔버스에 다시 그려 JPEG로 표준화하면서 크기도 줄인다.
  // blob: URL은 이 앱이 실행되는 샌드박스에서 막힐 수 있어, FileReader로 읽은 data: URL만 사용한다.
  function normalizeImage(file){
    const isHeic = /heic|heif/i.test(file.type||'') || /\.(heic|heif)$/i.test(file.name||'');

    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onerror = ()=> reject(new Error('사진 파일을 읽는 중 문제가 발생했습니다. 다른 사진으로 다시 시도해주세요.'));

      reader.onload = ()=>{
        const rawDataUrl = reader.result;
        const img = new Image();

        img.onload = ()=>{
          try{
            const MAX_DIM = 2800;
            const MIN_DIM = 1800;

            let width = img.width;
            let height = img.height;

            if(width===0 || height===0){
              reject(new Error('사진 크기를 읽을 수 없습니다. 다른 사진으로 다시 시도해주세요.'));
              return;
            }

            // 작은 캡처는 확대, 너무 큰 사진은 축소
            let ratio = 1;
            const longest = Math.max(width,height);
            if(longest < MIN_DIM){
              ratio = MIN_DIM / longest;
            }else if(longest > MAX_DIM){
              ratio = MAX_DIM / longest;
            }

            width = Math.round(width * ratio);
            height = Math.round(height * ratio);

            // 원본 미리보기
            const previewCanvas = document.createElement('canvas');
            previewCanvas.width = width;
            previewCanvas.height = height;
            const pctx = previewCanvas.getContext('2d', {willReadFrequently:true});
            pctx.fillStyle = '#fff';
            pctx.fillRect(0,0,width,height);
            pctx.drawImage(img, 0, 0, width, height);
            const previewDataUrl = previewCanvas.toDataURL('image/jpeg', 0.92);

            // OCR 전용 캔버스
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d', {willReadFrequently:true});
            ctx.fillStyle = '#fff';
            ctx.fillRect(0,0,width,height);
            ctx.drawImage(img, 0, 0, width, height);

            const imageData = ctx.getImageData(0,0,width,height);
            const data = imageData.data;

            // 전체 밝기 샘플로 다크 화면 여부 판단
            let sum = 0;
            let count = 0;
            const step = Math.max(4, Math.floor((width*height)/80000));
            for(let i=0;i<data.length;i+=4*step){
              const gray = 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
              sum += gray;
              count++;
            }
            const avg = count ? sum/count : 255;
            const invert = avg < 115;

            // grayscale + contrast 보정
            for(let i=0;i<data.length;i+=4){
              let gray = 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
              if(invert) gray = 255-gray;

              // 중간 대비를 강하게 해 작은 한글 획을 살림
              gray = Math.max(0, Math.min(255, (gray-128)*1.55 + 128));

              // 거의 흰/검은 영역은 더 명확하게
              if(gray > 225) gray = 255;
              if(gray < 45) gray = 0;

              data[i] = data[i+1] = data[i+2] = gray;
            }
            ctx.putImageData(imageData,0,0);

            // PNG가 텍스트 OCR에 더 유리
            const ocrDataUrl = canvas.toDataURL('image/png');

            resolve({
              base64: ocrDataUrl.split(',')[1],
              mediaType:'image/png',
              dataUrl: previewDataUrl
            });

          }catch(e){
            console.error(e);
            reject(new Error('사진을 처리하지 못했습니다. 화면 캡처 이미지를 다시 사용해주세요.'));
          }
        };

        img.onerror = ()=>{
          if(isHeic){
            reject(new Error('HEIC 형식은 브라우저에서 바로 읽기 어렵습니다. 사진 대신 화면 캡처 이미지를 사용해주세요.'));
          }else{
            reject(new Error('사진을 불러오지 못했습니다. 다른 사진으로 다시 시도해주세요.'));
          }
        };

        img.src = rawDataUrl;
      };

      reader.readAsDataURL(file);
    });
  }

    resultZone.innerHTML = `

      <label class="mini-label">과정명</label>
      <input type="text" id="course-input" value="${esc(guess.courseName||'')}" placeholder="예: [부산] 유선인증과정 BOOST(8월)">

      <input type="text" id="session-input" value="${esc(guess.session||'')}" placeholder="예: 18 또는 18차수">

      <label class="mini-label" style="margin-top:8px;">날짜</label>
      <input type="text" id="schedule-input" value="${esc(guess.schedule || todayStr)}" placeholder="예: 2026.08.12">

      <label class="mini-label" style="margin-top:8px;">강사</label>
      <input type="text" id="instructor-input" value="${esc(guess.instructor||'')}" placeholder="담당 강사">

      <div class="hint" style="margin-top:7px;">
        위 4개 항목만 사진에서 자동 입력합니다. 자동 인식값이 다르면 여기서 바로 수정하세요.
      </div>

      <label class="field-label">3. 교육생 정보 확인 (${draftStudents.length}명)</label>
      <div class="student-head-grid">
        <div>소속</div><div>매장명</div><div>이름</div><div>참여 시간</div><div></div>
      </div>
      <div id="draft-list"></div>

      <button class="btn btn-outline btn-sm" id="add-row-btn" style="margin-top:4px;">+ 교육생 직접 추가</button>
      <div class="hint">
        교육생의 <b>소속 / 매장명 / 이름</b>은 사진에서 자동 인식합니다. 소속은 <b>동대구마케팅팀 → 동대구</b>처럼 지역명만 입력되고, <b>참여 시간(분)</b>은 직접 입력합니다. 같은 이름은 자동으로 1명으로 합칩니다.
      </div>
      <button class="btn btn-primary" id="save-draft-btn" style="margin-top:16px;">명단 저장하고 태도 입력하기</button>
    `;

    renderDraftRows();

    document.getElementById('add-row-btn').onclick = ()=>{
      draftStudents.push(normalizeStudentRecord({
        id:uid(), affiliation:'', storeName:'', name:'', durationMin:'', score:null, reason:''
      }));
      renderDraftRows();
    };

    document.getElementById('save-draft-btn').onclick = async ()=>{
      const courseName = document.getElementById('course-input').value.trim();
      const session = normalizeSession(document.getElementById('session-input').value);
      const schedule = document.getElementById('schedule-input').value.trim() || todayStr;
      const instructor = document.getElementById('instructor-input').value.trim();

      if(courseName===''){
        toast('과정명을 입력해주세요');
        return;
      }

      const cleaned = mergeStudents([], draftStudents.filter(s=>String(s.name||'').trim()!==''));
      if(cleaned.length===0){
        toast('교육생을 최소 1명 입력해주세요');
        return;
      }

      // 같은 과정 + 같은 차수 + 같은 날짜가 이미 있으면 새 차수를 만들지 않고 갱신
      let sess = await findExistingSession(courseName, session, schedule);

      if(sess){
        sess.courseName = courseName;
        sess.session = session;
        sess.instructor = instructor || sess.instructor || '';
        sess.title = buildTitle(courseName, session);
        sess.date = schedule;
        sess.students = mergeStudents(sess.students || [], cleaned);

        const ok = await saveSession(sess);
        toast(ok
          ? '기존 차수에 중복 없이 명단을 반영했습니다.'
          : '저장에 실패했습니다');
        if(ok) renderDetail(sess.id);
        return;
      }

      sess = {
        id: uid(),
        courseName,
        session,
        instructor,
        title: buildTitle(courseName, session),
        date: schedule,
        students: cleaned
      };

      const ok = await saveSession(sess);
      toast(ok
        ? '명단이 저장되었습니다. 이어서 태도를 입력하세요.'
        : '저장에 실패했습니다');
      if(ok) renderDetail(sess.id);
    };
  }

  // 숫자만 입력하면 자동으로 "차수"를 붙여준다. 이미 "차수"가 붙어 있으면 그대로 둔다.
  function normalizeSession(v){
    v = (v||'').trim();
    if(v==='') return '';
    if(/차수\s*$/.test(v)) return v;
    if(/^\d+$/.test(v)) return v+'차수';
    return v+' 차수';
  }

  function buildTitle(courseName, session){
    courseName = (courseName||'').trim();
    session = (session||'').trim();
    if(!courseName) return '제목 없음';
    if(!session) return courseName;
    return `${courseName} ${session}`;
  }

  // 파일명/이미지 상단 표기용: "과정명_차수_담당강사" 형식
  function buildFileBase(s){
    const parts = [s.courseName || s.title || '교육', s.session || '', s.instructor || ''].filter(p=>p && p.trim()!=='');
    return parts.join('_').replace(/[\\/:*?"<>|]/g,'').trim() || '출석태도';
  }

            <input type="text" class="ds" value="${esc(s.storeName)}" placeholder="예: 율하점">

          <div class="mini-field student-name-field">

            <input type="text" class="dn" value="${esc(s.name)}" placeholder="예: 김세현">

      row.querySelector('.ds').oninput = e=> draftStudents[i].storeName = e.target.value;
      row.querySelector('.dn').oninput = e=> draftStudents[i].name = e.target.value;
      row.querySelector('.dd').oninput = e=> draftStudents[i].durationMin = e.target.value === '' ? '' : Math.max(0, +e.target.value);
    });

    wrap.querySelectorAll('[data-rm]').forEach(btn=>{
      btn.onclick = ()=>{
        draftStudents.splice(+btn.dataset.rm,1);
        renderDraftRows();
      };

  }

  // ---------- export: excel ----------
  function exportXlsx(){
    const s = currentSession;
    const fileBase = buildFileBase(s);

    const rows = s.students.map(raw=>{
      const st = normalizeStudentRecord(raw);
      return `
      <tr>
        <td>${esc(st.affiliation||'')}</td>
        <td>${esc(st.storeName||'')}</td>
        <td>${esc(st.name||'')}</td>
        <td>${esc(st.durationMin||'')}</td>
        <td>${st.score===null||st.score===undefined?'':esc(st.score)}</td>
        <td>${esc(st.reason||'')}</td>
      </tr>`;
    }).join('');

    const excelHtml = `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
table{border-collapse:collapse;font-family:"Malgun Gothic",sans-serif;font-size:11pt}
th,td{border:1px solid #999;padding:6px 8px;vertical-align:top}
th{font-weight:bold;background:#e9ecff}
.title{font-size:15pt;font-weight:bold}
.meta{font-size:10pt}

</head>

<div class="title">${esc(s.title||fileBase)}</div>

</tr></thead>

</table>
</body>
</html>`;

    const blob = new Blob(['\uFEFF', excelHtml], {type:'application/vnd.ms-excel;charset=utf-8'});

  function csvEscape(v){
    const s = (v===undefined||v===null?'':String(v));
    return '"'+s.replace(/"/g,'""')+'"';
  }
  function exportCsvFallback(){
    const s = currentSession;
    const fileBase = buildFileBase(s);
    const rows = [
      ['소속','매장명','이름','참여 시간(분)','점수','사유'],
      ...s.students.map(raw=>{
        const st = normalizeStudentRecord(raw);
        return [st.affiliation, st.storeName, st.name, st.durationMin, st.score, st.reason];
      })
    ];
    const csv = '\uFEFF' + rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=`${fileBase}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
  }

  // ---------- export: image (drawn directly on canvas, no external lib) ----------
  function wrapText(ctx, text, maxWidth){
    text = text || '';
    if(text==='') return [''];
    const lines = [];
    let line = '';
    for(const ch of text){
      const test = line + ch;
      if(ctx.measureText(test).width > maxWidth && line !== ''){
        lines.push(line);
        line = ch;
      }else{
        line = test;
      }
    }
    if(line !== '') lines.push(line);
    return lines.length ? lines : [''];
  }

  function downloadDataUrl(dataUrl, filename){
    const link = document.createElement('a');
    link.href = dataUrl;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function exportImage(){
    const s = currentSession;
    const fileBase = buildFileBase(s);
    const SCALE = 2;
    const W = 760;
    const PAD = 26;
    const colAffil = 105, colStore = 105, colName = 85, colDuration = 70, colScore = 45;
    const colReason = W - PAD*2 - colAffil - colStore - colName - colDuration - colScore;
    const lineH = 16;
    const rowPadV = 10;
    const headerH = 92;
    const tableHeadH = 32;

    const meas = document.createElement('canvas').getContext('2d');
    meas.font = '12px -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';

    const rows = s.students.map(raw=>{
      const st = normalizeStudentRecord(raw);
      const scoreTxt = (st.score!==null && st.score!==undefined && st.score!=='') ? String(st.score) : '-';
      const reasonLines = wrapText(meas, st.reason || '-', colReason - 12);
      const rowH = Math.max(lineH*2 + rowPadV, reasonLines.length*lineH + rowPadV);
      return {
        affiliation:st.affiliation||'-',
        storeName:st.storeName||'-',
        name:st.name||'',
        durationTxt:st.durationMin!=='' && st.durationMin!==undefined ? String(st.durationMin)+'분' : '-',
        scoreTxt,
        reasonLines,
        rowH
      };
    });

    const totalH = headerH + tableHeadH + rows.reduce((a,r)=>a+r.rowH,0) + PAD;
    const canvas = document.createElement('canvas');
    canvas.width = W*SCALE;
    canvas.height = totalH*SCALE;
    const ctx = canvas.getContext('2d');
    ctx.scale(SCALE, SCALE);

    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0,0,W,totalH);

    ctx.fillStyle = '#1E1B4B';
    ctx.font = '800 19px -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
    ctx.fillText(fileBase, PAD, 36);
    ctx.fillStyle = '#6B7280';
    ctx.font = '600 12px -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
    ctx.fillText(`${s.date || ''} · 교육생 ${s.students.length}명`, PAD, 56);

    ctx.strokeStyle = '#E7E9F5';
    ctx.beginPath(); ctx.moveTo(PAD,70); ctx.lineTo(W-PAD,70); ctx.stroke();

    let y = headerH;
    ctx.fillStyle = '#4F46E5';
    ctx.fillRect(PAD,y,W-PAD*2,tableHeadH);
    ctx.fillStyle = '#FFFFFF';
    ctx.font = '700 12px -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';

    ctx.fillText('소속', PAD+10, y+20);
    ctx.fillText('매장명', PAD+colAffil+10, y+20);
    ctx.fillText('이름', PAD+colAffil+colStore+10, y+20);
    ctx.fillText('참여', PAD+colAffil+colStore+colName+10, y+20);
    ctx.fillText('점수', PAD+colAffil+colStore+colName+colDuration+10, y+20);
    ctx.fillText('사유', PAD+colAffil+colStore+colName+colDuration+colScore+10, y+20);
    y += tableHeadH;

    rows.forEach((r,i)=>{
      ctx.fillStyle = i%2 ? '#F5F6FF' : '#FFFFFF';
      ctx.fillRect(PAD,y,W-PAD*2,r.rowH);

      ctx.font = '500 11.5px -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
      ctx.fillStyle = '#374151';
      ctx.fillText(r.affiliation, PAD+10, y+18);
      ctx.fillText(r.storeName, PAD+colAffil+10, y+18);

      ctx.font = '700 12.5px -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
      ctx.fillStyle = '#1F2430';
      ctx.fillText(r.name, PAD+colAffil+colStore+10, y+18);
      ctx.fillText(r.durationTxt, PAD+colAffil+colStore+colName+10, y+18);
      ctx.fillText(r.scoreTxt, PAD+colAffil+colStore+colName+colDuration+10, y+18);

      ctx.font = '500 11.5px -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
      ctx.fillStyle = '#374151';
      r.reasonLines.forEach((ln,li)=>
        ctx.fillText(ln, PAD+colAffil+colStore+colName+colDuration+colScore+10, y+18+li*lineH)
      );

      ctx.strokeStyle = '#E7E9F5';
      ctx.beginPath(); ctx.moveTo(PAD,y+r.rowH); ctx.lineTo(W-PAD,y+r.rowH); ctx.stroke();
      y += r.rowH;
    });

    try{
      const dataUrl = canvas.toDataURL('image/png');
      downloadDataUrl(dataUrl, `${fileBase}.png`);
      toast('이미지가 저장되었습니다');
    }catch(e){
      console.error('image export fail', e);
      toast('이미지 생성에 실패했습니다');
    }
  }

  renderList();
})();
</script>

</body>
</html>
